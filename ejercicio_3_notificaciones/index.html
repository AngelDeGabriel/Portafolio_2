<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones Push Locales</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f9f9f9; }
        .contenedor { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; margin: 10px; color: white; }
        #btn-permiso { background-color: #f39c12; }
        #btn-permiso:hover { background-color: #e67e22; }
        #btn-notificar { background-color: #9b59b6; }
        #btn-notificar:hover { background-color: #8e44ad; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        p { font-size: 18px; color: #333; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Notificaciones con Service Worker</h2>
        
        <p>Estado del permiso: <strong id="estado-permiso">Desconocido</strong></p>
        
        <button id="btn-permiso">Solicitar Permiso</button>
        <button id="btn-notificar" disabled>Enviar Notificación Local</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
